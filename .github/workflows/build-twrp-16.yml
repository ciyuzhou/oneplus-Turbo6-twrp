name: Build TWRP 16 for OnePlus Turbo 6

on:
  workflow_dispatch:
    inputs:
      SHOULD_RELEASE:
        description: "Whether to create a release"
        required: false
        default: "false"
      DEVICE_NAME:
        description: "Device name (for output naming)"
        required: false
        default: "sm87xx"
      BUILD_PARTITION:
        description: "Build partition (recovery/boot)"
        required: false
        default: "recovery"
  push:
    paths:
      - ".github/workflows/build-twrp-16.yml"
      - "patches/**"
      - "README.md"

permissions:
  contents: write          # 改为 write，用于 Release

concurrency:
  group: twrp16-oneplus-turbo6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MANIFEST_URL: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-16.0
      MANIFEST_COMMIT: 512614e74d5a65f7b11fbd0b424f0d68b5ef7fe1
      VOLD_COMMIT: 953de9608eb78380b3c4e39e801c2bc0af7dbddc
      DEVICE_TREE_URL: https://github.com/ciyuzhou/twrp_device_oplus_sm87xx.git
      DEVICE_TREE_BRANCH: twrp-16.0
      DEVICE_TREE_COMMIT: 74d075623b35f685fcde82efb5a43548697d1a6e
      TURBO6_TOUCH_COMMIT: dd7a43fdb13c4440df99fbe145bead37e5435aef
      DEVICE_PATH: device/oplus/sm87xx
      PRODUCT_NAME: sm87xx
      LUNCH_TARGET: twrp_sm87xx
      TZ: UTC

    steps:
      # ... 前面的步骤与 Turbo6 工作流完全一致 ...
      # 1. Reclaim runner disk space
      # 2. Maximize build space
      # 3. Check out builder and decryption patches
      # 4. Restore compiler cache
      # 5. Configure zram
      # 6. Install repo launcher
      # 7. Initialize and pin TWRP 16 manifest
      # 8. Sync TWRP source
      # 9. Pin and patch TWRP vold decryption
      # 10. Fetch and verify Turbo 6 device tree
      # 11. Record exact source revisions

      - name: Build TWRP recovery image
        shell: bash
        run: |
          set -exo pipefail
          cd "$GITHUB_WORKSPACE/source"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=5G
          ccache -M 5G

          lunch "$LUNCH_TARGET"
          # 用 input 控制构建目标，默认 recoveryimage
          m "${{ github.event.inputs.BUILD_PARTITION || 'recovery' }}image"

      - name: Validate and stage output
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/source"
          partition="${{ github.event.inputs.BUILD_PARTITION || 'recovery' }}"
          image="out/target/product/$PRODUCT_NAME/${partition}.img"
          test -s "$image"

          # recovery 分区大小校验仅在 recovery 时执行
          if [ "$partition" = "recovery" ]; then
            test "$(stat -c '%s' "$image")" -le 104857600
          fi
          file "$image" | grep -Fq "Android bootimg"

          output="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$output"
          device_name="${{ github.event.inputs.DEVICE_NAME || 'sm87xx' }}"
          name="TWRP-3.7.1-16-${device_name}-PLU110-${GITHUB_RUN_ID}.img"
          cp "$image" "$output/$name"
          cp BUILD_INFO.txt pinned-manifest.xml "$output/"
          cp "$GITHUB_WORKSPACE"/patches/*.patch "$output/"
          (
            cd "$output"
            sha256sum "$name" > SHA256SUMS.txt
          )
          cat "$output/SHA256SUMS.txt"

      - name: Upload recovery image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TWRP-16-OnePlus-Turbo6-PLU110-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload to Release
        if: ${{ github.event.inputs.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.img
          name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME || 'sm87xx' }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body_path: artifacts/BUILD_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}